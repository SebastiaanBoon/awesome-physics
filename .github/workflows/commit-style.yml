name: Commit style

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pull requests are squash-merged, so the title becomes the commit.
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 dev/scripts/check_commit.py -

      - name: Check every commit in the pull request
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          status=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            echo "→ $sha $(git log -1 --format=%s "$sha")"
            if ! git log -1 --format=%B "$sha" | python3 dev/scripts/check_commit.py -; then
              status=1
            fi
          done
          exit "$status"
